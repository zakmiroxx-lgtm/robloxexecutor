name: Build Executor

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller requests pywin32 websocket-client

      - name: Build Executor EXE
        run: |
          pyinstaller --onefile --noconsole --name "RbxExecutor" src/main.py

      - name: Build SFX ZIP
        run: |
          python build_sfx.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RbxExecutor-SFX
          path: output/RbxExecutor_Setup.exe
