name: Build XcX Executor (v1 - C++)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip if needed
        shell: pwsh
        run: |
          if (-not (Test-Path "main.py")) {
            $z = Get-ChildItem -File -Filter "*.zip" | Select-Object -First 1

            if (-not $z) {
              throw "ERROR: main.py not found and no ZIP archive was found."
            }

            Expand-Archive -LiteralPath $z.FullName -DestinationPath "." -Force

            if (-not (Test-Path "main.py")) {
              $sub = Get-ChildItem -Directory | Where-Object {
                Test-Path (Join-Path $_.FullName "main.py")
              } | Select-Object -First 1

              if (-not $sub) {
                throw "ERROR: main.py was not found after extracting the ZIP."
              }

              Copy-Item -Path (Join-Path $sub.FullName "*") -Destination "." -Recurse -Force
              Remove-Item -LiteralPath $sub.FullName -Recurse -Force
            }
          }

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Create C++ output directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist_cpp" | Out-Null

      - name: Build injector.exe
        shell: cmd
        run: |
          cl.exe /nologo /O2 /EHsc /W0 ^
            /Fe:dist_cpp\XcXInjector.exe ^
            src\injector.cpp ^
            /link psapi.lib

      - name: Build executor.dll
        shell: cmd
        run: |
          cl.exe /nologo /O2 /EHsc /W0 /LD ^
            /Fe:dist_cpp\executor.dll ^
            src\executor_dll.cpp ^
            /link psapi.lib

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pyinstaller pywin32 requests

      - name: Build UI exe
        run: pyinstaller --onefile --noconsole --name "RbxExecutor" main.py

      - name: Collect output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release" | Out-Null
          Copy-Item "dist\RbxExecutor.exe" "release\"
          Copy-Item "dist_cpp\XcXInjector.exe" "release\"
          Copy-Item "dist_cpp\executor.dll" "release\"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: XcX-Executor-v1
          path: release/
          retention-days: 30
